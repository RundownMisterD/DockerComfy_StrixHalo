# =============================================================================
# ComfyUI Docker Compose for AMD Ryzen AI Max Pro 390 (Strix Halo / gfx1151)
#
# Usage:
#   docker compose up -d          # start in background
#   docker compose logs -f        # follow logs
#   docker compose down            # stop
#   docker compose build --no-cache  # rebuild from scratch
#
# ComfyUI will be available at http://localhost:8188
# =============================================================================

services:
  comfyui:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BASE_IMAGE=${BASE_IMAGE:-rocm/pytorch:latest}
        - PYTORCH_ROCM_INDEX=${PYTORCH_ROCM_INDEX:-https://download.pytorch.org/whl/rocm6.2}
        - COMFYUI_REF=${COMFYUI_REF:-master}
        - SKIP_PYTORCH_INSTALL=${SKIP_PYTORCH_INSTALL:-false}
    image: comfyui-strix-halo:latest
    container_name: comfyui-strix-halo

    # ---- ROCm GPU device passthrough ----------------------------------------
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video
      - render
    security_opt:
      - seccomp=unconfined
    ipc: host
    shm_size: "8G"

    # ---- Port mapping --------------------------------------------------------
    ports:
      - "${COMFYUI_PORT:-8188}:8188"

    # ---- Volume mounts (all ComfyUI data externalized) -----------------------
    # All paths are configurable via .env. Defaults to ./data/<subdir>.
    volumes:
      - ${COMFYUI_MODELS_DIR:-./data/models}:/app/ComfyUI/models
      - ${COMFYUI_OUTPUT_DIR:-./data/output}:/app/ComfyUI/output
      - ${COMFYUI_INPUT_DIR:-./data/input}:/app/ComfyUI/input
      - ${COMFYUI_CUSTOM_NODES_DIR:-./data/custom_nodes}:/app/ComfyUI/custom_nodes
      - ${COMFYUI_USER_DIR:-./data/user}:/app/ComfyUI/user
      - ${COMFYUI_TEMP_DIR:-./data/temp}:/app/ComfyUI/temp

    # ---- Strix Halo GPU environment -----------------------------------------
    environment:
      # GPU compute configuration
      - HSA_OVERRIDE_GFX_VERSION=${HSA_OVERRIDE_GFX_VERSION:-11.0.0}
      - HSA_ENABLE_SDMA=${HSA_ENABLE_SDMA:-0}
      - GPU_MAX_ALLOC_PERCENT=${GPU_MAX_ALLOC_PERCENT:-100}
      - GPU_MAX_HEAP_SIZE=${GPU_MAX_HEAP_SIZE:-100}
      - HIP_VISIBLE_DEVICES=${HIP_VISIBLE_DEVICES:-0}
      # PyTorch memory management
      - PYTORCH_HIP_ALLOC_CONF=${PYTORCH_HIP_ALLOC_CONF:-backend:native,expandable_segments:True,garbage_collection_threshold:0.9,max_split_size_mb:512}
      # Flash attention workaround for gfx1151
      - FLASH_ATTENTION_TRITON_AMD_ENABLE=${FLASH_ATTENTION_TRITON_AMD_ENABLE:-1}
      - TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL=${TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL:-1}
      # Extra ComfyUI CLI arguments (optional)
      - COMFYUI_EXTRA_ARGS=${COMFYUI_EXTRA_ARGS:-}

    restart: unless-stopped
